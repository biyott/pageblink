### A note (markdown) or an uploaded PDF. projectId null means personal.
class: Document
table: document
fields:
  ownerId: UuidValue
  projectId: int?
  ### note | pdf
  kind: String, default='pdf'
  title: String
  ### Markdown body for notes; null for PDFs.
  body: String?
  contentHash: String
  version: int
  pageCount: int
  storagePath: String?
  ### uploaded | indexing | ready | failed
  status: String
  ### Why the last indexing failed (shown in the app, cleared on success).
  lastError: String?
  embeddingModel: String
  createdAt: DateTime
  updatedAt: DateTime
indexes:
  document_owner_idx:
    fields: ownerId
  document_project_idx:
    fields: projectId
