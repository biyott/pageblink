services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: pageblink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pageblink_data:/var/lib/postgresql/data


  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: pageblink_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-changeme}
    volumes:
      - pageblink_test_data:/var/lib/postgresql/data


volumes:
  pageblink_data:
  pageblink_test_data:
