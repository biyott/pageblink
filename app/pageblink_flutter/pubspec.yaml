name: pageblink_flutter
description: A new Flutter project with Serverpod.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+1

environment:
  sdk: '^3.12.2'
  flutter: '^3.44.4'

resolution: workspace

dependencies:
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  crypto: ^3.0.7
  cupertino_icons: ^1.0.5
  desktop_drop: ^0.8.4
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^8.1.0
  gpt_markdown: ^1.3.4
  http: ^1.6.0
  lucide_icons_flutter: ^3.1.25
  pageblink_client:
    path: ../pageblink_client
  path_provider: ^2.1.6
  pdfrx: ^2.6.5
  serverpod_auth_idp_flutter: 4.0.4
  serverpod_flutter: 4.0.4
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  # Used for agents to drive the app through the Dart MCP
  flutter_driver:
    sdk: flutter
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter

dependency_overrides:
  flutter_secure_storage: ^10.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages
  assets:
    - assets/config.json
    # google_fonts reads Fraunces w600 from here (file name = API file name), so
    # the title font needs no runtime download.
    - assets/google_fonts/

  # Body font for Latin + Hangul (Pretendard 1.3.9 subset, SIL OFL:
  # assets/fonts/OFL-Pretendard.txt). KS X 1001 2,350 syllables + compat jamo +
  # Latin/punctuation. Declared here so the web engine loads it before the first
  # frame (see docs/research/022). Only 400/500/600 are bundled: Flutter picks the
  # nearest declared face for w700/bold, which lands on 600.
  fonts:
    - family: PretendardSubset
      fonts:
        - asset: assets/fonts/Pretendard-400-subset.otf
          weight: 400
        - asset: assets/fonts/Pretendard-500-subset.otf
          weight: 500
        - asset: assets/fonts/Pretendard-600-subset.otf
          weight: 600
    # Hangul serif for titles (Noto Serif KR subset, same character set;
    # SIL OFL: assets/fonts/OFL-NotoSerifKR.txt). Only w600 is used.
    - family: NotoSerifKRSubset
      fonts:
        - asset: assets/fonts/NotoSerifKR-600-subset.ttf
          weight: 600
