<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1010" viewBox="0 0 1500 1010"><defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EDE6FA"/><stop offset=".5" stop-color="#F7E8EE"/><stop offset="1" stop-color="#FFE9DC"/></linearGradient><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EDE6FA"/><stop offset=".5" stop-color="#F7E8EE"/><stop offset="1" stop-color="#FFE9DC"/></linearGradient><clipPath id="c3"><rect x="60" y="150" width="380" height="822" rx="24"/></clipPath><clipPath id="ac"><rect x="540" y="150" width="380" height="822" rx="24"/></clipPath></defs><rect width="1500" height="1010" fill="#FBF8F4"/><text x="40" y="48" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700" fill="#1F1B16" >4 · 질문(Ask) 패널 — 빈 상태 · 제안 · 컴포저</text><text x="40" y="74" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13.5" font-weight="500" fill="#5C5348" >현재 캡처(380px 패널)와 제안. 브랜드 순간: 별(V1b) + 번개 알약을 한 엠블럼으로, 본문과 같은 ⚡n 알약을 안내문에 사용.</text><rect x="40" y="100" width="420" height="892" rx="24" fill="url(#bg1)" /><rect x="520" y="100" width="420" height="892" rx="24" fill="url(#bg2)" /><text x="60" y="130" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="700" fill="#6B6358" >전 · 현재</text><text x="540" y="130" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="700" fill="#6C4CF5" >후 · 제안</text><g clip-path="url(#c3)"><image href="current-desktop-board-light.png" x="-976.0" y="126.0" width="1440.0" height="900.0"/></g><g clip-path="url(#ac)"><rect x="540" y="150" width="380" height="822" rx="24" fill="#FFFFFF" stroke="#fff" stroke-width="1" fill-opacity="0.62" /><g transform="translate(560 172) scale(1.0)" fill="none" stroke="#6C4CF5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/></g><text x="592" y="192" font-family="Georgia, AppleMyungjo, serif" font-size="26" font-weight="700" fill="#1F1B16" >질문</text><circle cx="884" cy="184" r="18" fill="#1F1B16" fill-opacity=".06"/><g transform="translate(873 173) scale(0.9166666666666666)" fill="none" stroke="#5C5348" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h7"/><path d="M17 3v6"/><path d="M14 6h6"/></g><rect x="698.0" y="238" width="64" height="64" rx="20" fill="#FFFFFF" stroke="#fff" stroke-width="1" fill-opacity="0.9" /><g transform="translate(708.0 248) scale(1.8333333333333333)" fill="none" stroke="#6C4CF5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/></g><rect x="734.0" y="278" width="34" height="24" rx="12.0" fill="#6C4CF5" /><g transform="translate(742.0 281) scale(0.75)" fill="#fff" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></g><text x="730.0" y="346" font-family="Georgia, AppleMyungjo, serif" font-size="24" font-weight="700" fill="#1F1B16" text-anchor="middle" >노트와 문서에 질문하세요</text><text x="670.0" y="376" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="500" fill="#5C5348" text-anchor="middle" >모든 답변은</text><rect x="722.0" y="362" width="38" height="20" rx="10.0" fill="#EAE4FD" /><g transform="translate(729.0 366) scale(0.5)" fill="none" stroke="#6C4CF5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></g><text x="747.0" y="377" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="700" fill="#2E1F85" text-anchor="middle" >1</text><text x="808.0" y="376" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="500" fill="#5C5348" text-anchor="middle" >출처로 연결돼요</text><text x="560" y="432" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="600" fill="#5C5348" >이렇게 물어보세요</text><rect x="556" y="446" width="348" height="52" rx="14" fill="#FFFFFF" stroke="#E4DDD0" stroke-width="1" fill-opacity="0.82" /><rect x="568" y="456" width="32" height="32" rx="10" fill="#FFF1B8" /><g transform="translate(575 463) scale(0.75)" fill="none" stroke="#1F1B16" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9a2.4 2.4 0 0 0 1.7-.7l4.6-4.6A2.4 2.4 0 0 0 21 14V5a2 2 0 0 0-2-2z"/><path d="M15 21v-4a2 2 0 0 1 2-2h4"/></g><text x="612" y="477" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="500" fill="#1F1B16" >이번 주에 남은 일은 뭐야?</text><g transform="translate(870 463) scale(0.75)" fill="none" stroke="#5C5348" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></g><rect x="556" y="506" width="348" height="52" rx="14" fill="#FFFFFF" stroke="#E4DDD0" stroke-width="1" fill-opacity="0.82" /><rect x="568" y="516" width="32" height="32" rx="10" fill="#D6E8F8" /><g transform="translate(575 523) scale(0.75)" fill="none" stroke="#1F1B16" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9a2.4 2.4 0 0 0 1.7-.7l4.6-4.6A2.4 2.4 0 0 0 21 14V5a2 2 0 0 0-2-2z"/><path d="M15 21v-4a2 2 0 0 1 2-2h4"/></g><text x="612" y="537" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="500" fill="#1F1B16" >회의록에서 결정된 사항은?</text><g transform="translate(870 523) scale(0.75)" fill="none" stroke="#5C5348" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></g><rect x="556" y="566" width="348" height="52" rx="14" fill="#FFFFFF" stroke="#E4DDD0" stroke-width="1" fill-opacity="0.82" /><rect x="568" y="576" width="32" height="32" rx="10" fill="#E9E3FC" /><g transform="translate(575 583) scale(0.75)" fill="none" stroke="#1F1B16" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></g><text x="612" y="597" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="500" fill="#1F1B16" >이 PDF의 핵심 요약</text><g transform="translate(870 583) scale(0.75)" fill="none" stroke="#5C5348" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></g><text x="730.0" y="648" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="600" fill="#6C4CF5" text-anchor="middle" >다른 질문 5개 더 보기</text><g transform="translate(796.0 636) scale(0.6666666666666666)" fill="none" stroke="#6C4CF5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g><rect x="552" y="786" width="356" height="134" rx="20" fill="#FFFFFF" stroke="#fff" stroke-width="1" fill-opacity="0.9" /><text x="570" y="826" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="400" fill="#5C5348" >노트와 문서에 질문하기…</text><rect x="566" y="868" width="116" height="36" rx="18.0" fill="#FFFFFF" stroke="#E4DDD0" stroke-width="1" /><g transform="translate(578 877) scale(0.75)" fill="none" stroke="#5C5348" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M7 12h10"/><path d="M10 18h4"/></g><text x="602" y="891" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="500" fill="#1F1B16" >내 문서만</text><g transform="translate(664 879) scale(0.6666666666666666)" fill="none" stroke="#5C5348" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g><rect x="690" y="868" width="78" height="36" rx="18.0" fill="#FFFFFF" stroke="#E4DDD0" stroke-width="1" /><text x="710" y="891" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="500" fill="#1F1B16" >자동</text><g transform="translate(740 879) scale(0.6666666666666666)" fill="none" stroke="#5C5348" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g><circle cx="872" cy="886" r="20" fill="#EAE4FD"/><g transform="translate(860 874) scale(1.0)" fill="none" stroke="#6C4CF5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></g><text x="730.0" y="942" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="500" fill="#5C5348" text-anchor="middle" >AI는 틀릴 수 있어요. 답변의 출처를 확인하세요.</text></g><circle cx="900" cy="160" r="11" fill="#D6336C"/><text x="900" y="164.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >1</text><circle cx="570" cy="376" r="11" fill="#D6336C"/><text x="570" y="380.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >2</text><circle cx="890" cy="450" r="11" fill="#D6336C"/><text x="890" y="454.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >3</text><circle cx="900" cy="796" r="11" fill="#D6336C"/><text x="900" y="800.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >4</text><circle cx="840" cy="864" r="11" fill="#D6336C"/><text x="840" y="868.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >5</text><circle cx="991" cy="190" r="11" fill="#D6336C"/><text x="991" y="194.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >1</text><text x="1012" y="195" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14.5" font-weight="700" fill="#1F1B16" >엠블럼 1개</text><text x="1012" y="217" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="500" fill="#5C5348" >헤더 아이콘과 중앙 아이콘이 같은 말풍선(?)이라</text><text x="1012" y="235" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="500" fill="#5C5348" >중복. 헤더는 별 + "질문", 중앙은 별 + 번개</text><text x="1012" y="253" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="500" fill="#5C5348" >알약 엠블럼(앱 아이콘 V1b와 인용 ⚡의 결합).</text><circle cx="991" cy="308" r="11" fill="#D6336C"/><text x="991" y="312.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >2</text><text x="1012" y="313" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14.5" font-weight="700" fill="#1F1B16" >안내문의 ⚡는 실제 알약</text><text x="1012" y="335" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="500" fill="#5C5348" >현재는 문자 ⚡(OS 이모지 폴백, 캡처에선 두부</text><text x="1012" y="353" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="500" fill="#5C5348" >글리프). 답변 본문과 같은 ⚡n 알약 위젯을 쓴다.</text><circle cx="991" cy="426" r="11" fill="#D6336C"/><text x="991" y="430.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >3</text><text x="1012" y="431" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14.5" font-weight="700" fill="#1F1B16" >제안 8개 → 3개 + 더 보기</text><text x="1012" y="453" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="500" fill="#5C5348" >같은 흰 사각 8장이 화면 절반. 노트 파스텔 타일 +</text><text x="1012" y="471" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="500" fill="#5C5348" >종류 아이콘, 좌측 정렬 한 줄, 높이 52. 샘플</text><text x="1012" y="489" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="500" fill="#5C5348" >노트가 있으면 샘플 질문부터.</text><circle cx="991" cy="544" r="11" fill="#D6336C"/><text x="991" y="548.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >4</text><text x="1012" y="549" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14.5" font-weight="700" fill="#1F1B16" >컴포저 3행 → 2행</text><text x="1012" y="571" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="500" fill="#5C5348" >범위·모델은 입력 아래 한 줄로(칩 36), 전송은</text><text x="1012" y="589" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="500" fill="#5C5348" >같은 줄 오른쪽 끝. 입력창 높이를 2줄 이상 쓰지</text><text x="1012" y="607" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="500" fill="#5C5348" >않아 목록이 더 보임.</text><circle cx="991" cy="662" r="11" fill="#D6336C"/><text x="991" y="666.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >5</text><text x="1012" y="667" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14.5" font-weight="700" fill="#1F1B16" >빈 입력의 전송 버튼</text><text x="1012" y="689" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="500" fill="#5C5348" >베이지 회색 원은 "고장난 버튼"처럼 보인다.</text><text x="1012" y="707" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="500" fill="#5C5348" >accentContainer 채움 + accent</text><text x="1012" y="725" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="500" fill="#5C5348" >아이콘으로 브랜드 안에서 비활성 표현.</text></svg>