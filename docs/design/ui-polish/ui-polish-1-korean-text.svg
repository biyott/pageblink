<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930"><defs><clipPath id="c1"><rect x="60" y="160" width="240" height="440" rx="20"/></clipPath><clipPath id="c2"><rect x="330" y="160" width="230" height="250" rx="16"/></clipPath><clipPath id="c3"><rect x="330" y="430" width="374" height="40" rx="10"/></clipPath><linearGradient id="f4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9F0E1" stop-opacity="0"/><stop offset="1" stop-color="#D9F0E1" stop-opacity="1"/></linearGradient></defs><rect width="1400" height="930" fill="#FBF8F4"/><text x="40" y="48" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700" fill="#1F1B16" >1 · 한글 작은 텍스트 — 줄바꿈·굵기·색·자간</text><text x="40" y="74" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13.5" font-weight="500" fill="#5C5348" >왼쪽은 현재 앱(HEAD) 캡처 그대로, 오른쪽은 제안 시안. 같은 데이터(샘플 · PageBlink 시작하기 노트, 계층 영역).</text><rect x="40" y="100" width="640" height="520" rx="24" fill="#F3EAF5" /><text x="64" y="134" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="700" fill="#6B6358" >전 · 현재</text><text x="124" y="134" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="500" fill="#5C5348" >(HEAD 캡처)</text><rect x="720" y="100" width="640" height="520" rx="24" fill="#F3EAF5" /><text x="744" y="134" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="700" fill="#6C4CF5" >후 · 제안</text><text x="804" y="134" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="500" fill="#5C5348" >(Pretendard 400/500/600 + keep-all)</text><g clip-path="url(#c1)"><image href="current-desktop-board-light.png" x="36.0" y="136.0" width="1440.0" height="900.0"/></g><g clip-path="url(#c2)"><image href="current-desktop-board-light.png" x="42.0" y="-154.0" width="1440.0" height="900.0"/></g><g clip-path="url(#c3)"><image href="current-desktop-board-light.png" x="42.0" y="257.0" width="1440.0" height="900.0"/></g><text x="330" y="500" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="400" fill="#6B6358" >12px · w400 · #6B6358 — 칩/메타/계층 라벨이 얇고 옅음</text><text x="330" y="520" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="400" fill="#6B6358" >어절 중간에서 줄이 바뀜: "출/처가", "질문하/면", "시작/하기"</text><rect x="740" y="168" width="240" height="440" rx="24" fill="#6C4CF5" fill-opacity="0.06" /><rect x="740" y="160" width="240" height="440" rx="24" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.2" fill-opacity="0.62" /><g transform="translate(756 178) scale(1.0)" fill="none" stroke="#6C4CF5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/></g><text x="788" y="198" font-family="Georgia, AppleMyungjo, serif" font-size="20" font-weight="700" fill="#1F1B16" >PageBlink</text><text x="756" y="226" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="500" fill="#5C5348" >노트와 문서에 물어보세요.</text><text x="756" y="244" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="500" fill="#5C5348" >답마다 출처가 보여요.</text><rect x="752" y="264" width="216" height="40" rx="14" fill="#6C4CF5" /><g transform="translate(766 274) scale(0.8333333333333334)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9a2.4 2.4 0 0 0 1.7-.7l4.6-4.6A2.4 2.4 0 0 0 21 14V5a2 2 0 0 0-2-2z"/><path d="M15 21v-4a2 2 0 0 1 2-2h4"/></g><text x="794" y="290" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="600" fill="#fff" >노트</text><text x="952" y="290" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="500" fill="#fff" text-anchor="end" >8</text><g transform="translate(766 318) scale(0.8333333333333334)" fill="none" stroke="#1F1B16" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M9 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></g><text x="794" y="334" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="500" fill="#1F1B16" >프로젝트</text><text x="952" y="334" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="500" fill="#5C5348" text-anchor="end" >2</text><g transform="translate(766 362) scale(0.8333333333333334)" fill="none" stroke="#1F1B16" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/><path d="M12 2v3"/><path d="M12 19v3"/><path d="M4.9 4.9l2.1 2.1"/><path d="M17 17l2.1 2.1"/><path d="M2 12h3"/><path d="M19 12h3"/><path d="M4.9 19.1 7 17"/><path d="M17 7l2.1-2.1"/></g><text x="794" y="378" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="500" fill="#1F1B16" >설정</text><text x="760" y="422" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="600" fill="#5C5348" >계층</text><rect x="758" y="436" width="32" height="32" rx="10" fill="#1F1B16" fill-opacity="0.08" /><g transform="translate(764 442) scale(0.8333333333333334)" fill="none" stroke="#1F1B16" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></g><text x="800" y="450" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="600" fill="#5C5348" >Cloak</text><text x="800" y="467" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="500" fill="#5C5348" >기기 전용</text><rect x="930" y="442" width="32" height="20" rx="10.0" fill="#1F1B16" /><rect x="930" y="442" width="32" height="20" rx="10" fill="#1F1B16" fill-opacity=".08"/><text x="946" y="456" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="600" fill="#5C5348" text-anchor="middle" >곧</text><rect x="758" y="488" width="32" height="32" rx="10" fill="#1F1B16" fill-opacity="0.08" /><g transform="translate(764 494) scale(0.8333333333333334)" fill="none" stroke="#1F1B16" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></g><text x="800" y="502" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="600" fill="#1F1B16" >내 클라우드</text><text x="800" y="519" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="500" fill="#5C5348" >나만 보기</text><text x="962" y="508" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="500" fill="#5C5348" text-anchor="end" >7</text><rect x="758" y="540" width="32" height="32" rx="10" fill="#1F1B16" fill-opacity="0.08" /><g transform="translate(764 546) scale(0.8333333333333334)" fill="none" stroke="#1F1B16" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M9 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></g><text x="800" y="554" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="600" fill="#1F1B16" >Shared Vision</text><text x="800" y="571" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="500" fill="#5C5348" >Hackathon 2026 외 1</text><text x="962" y="560" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="500" fill="#5C5348" text-anchor="end" >1</text><rect x="1010" y="162" width="230" height="250" rx="16" fill="#1F1B16" fill-opacity="0.06" /><rect x="1010" y="160" width="230" height="250" rx="16" fill="#D9F0E1" stroke="#FFFFFF" stroke-width="1.2" /><rect x="1024" y="174" width="32" height="32" rx="10" fill="#1F1B16" fill-opacity="0.08" /><g transform="translate(1031 181) scale(0.75)" fill="none" stroke="#1F1B16" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9a2.4 2.4 0 0 0 1.7-.7l4.6-4.6A2.4 2.4 0 0 0 21 14V5a2 2 0 0 0-2-2z"/><path d="M15 21v-4a2 2 0 0 1 2-2h4"/></g><text x="1064" y="194" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="500" fill="#5C5348" >2분 전</text><g transform="translate(1206 180) scale(0.8333333333333334)" fill="none" stroke="#5C5348" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5h.01"/><path d="M12 12h.01"/><path d="M12 19h.01"/></g><text x="1024" y="232.0" font-family="Georgia, AppleMyungjo, serif" font-size="18" font-weight="700" fill="#1F1B16" >샘플 · PageBlink</text><text x="1024" y="255.4" font-family="Georgia, AppleMyungjo, serif" font-size="18" font-weight="700" fill="#1F1B16" >시작하기</text><text x="1024" y="288.0" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13.5" font-weight="400" fill="#1F1B16" >노트를 쓰고 PDF를 올린 뒤,</text><text x="1024" y="308.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13.5" font-weight="400" fill="#1F1B16" >질문하면 ⚡ 출처가 해당</text><text x="1024" y="329.0" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13.5" font-weight="400" fill="#1F1B16" >페이지로 안내합니다. 이</text><text x="1024" y="349.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13.5" font-weight="400" fill="#1F1B16" >노트에 대해 질문해 보세요.</text><rect x="1010" y="330" width="230" height="40" rx="0" fill="url(#f4)" /><rect x="1024" y="376" width="44" height="22" rx="11.0" fill="#EAE4FD" /><text x="1046" y="391" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="600" fill="#2E1F85" text-anchor="middle" >샘플</text><rect x="1010" y="430" width="76" height="32" rx="16.0" fill="#EAE4FD" stroke="#6C4CF5" stroke-width="1.2" /><g transform="translate(1020 438) scale(0.6666666666666666)" fill="none" stroke="#2E1F85" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></g><text x="1042" y="451" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="600" fill="#2E1F85" >전체 8</text><rect x="1094" y="430" width="70" height="32" rx="16.0" fill="#FFFFFF" stroke="#E4DDD0" stroke-width="1" /><text x="1129.0" y="451" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="500" fill="#1F1B16" text-anchor="middle" >노트 6</text><rect x="1172" y="430" width="70" height="32" rx="16.0" fill="#FFFFFF" stroke="#E4DDD0" stroke-width="1" /><text x="1207.0" y="451" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="500" fill="#1F1B16" text-anchor="middle" >PDF 2</text><rect x="1010" y="472" width="104" height="32" rx="16.0" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2" /><g transform="translate(1020 480) scale(0.6666666666666666)" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/><path d="M12 8v4"/><path d="M12 16h.01"/></g><text x="1042" y="493" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="600" fill="#B45309" >확인 필요 1</text><text x="1010" y="540" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="500" fill="#5C5348" >12px 이하 · w500 · #5C5348</text><text x="1010" y="558" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="500" fill="#5C5348" >어절 단위 줄바꿈, 개인 노트는 티어 칩 없음</text><circle cx="1252" cy="222" r="11" fill="#D6336C"/><text x="1252" y="226.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >1</text><circle cx="1124" cy="184" r="11" fill="#D6336C"/><text x="1124" y="188.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >2</text><circle cx="810" cy="416" r="11" fill="#D6336C"/><text x="810" y="420.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >3</text><circle cx="1236" cy="336" r="11" fill="#D6336C"/><text x="1236" y="340.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >4</text><circle cx="1236" cy="396" r="11" fill="#D6336C"/><text x="1236" y="400.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >5</text><circle cx="51" cy="662" r="11" fill="#D6336C"/><text x="51" y="666.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >1</text><text x="72" y="667" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="700" fill="#1F1B16" >keep-all 줄바꿈</text><text x="72" y="686" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="500" fill="#5C5348" >어절 안에서 줄이 끊기지 않게 음절 사이에 U+2060(WORD JOINER)을 넣는다.</text><text x="72" y="703" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="500" fill="#5C5348" >제목·미리보기·사이드바 안내문 등 정적 UI 텍스트에만 적용.</text><circle cx="51" cy="738" r="11" fill="#D6336C"/><text x="51" y="742.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >2</text><text x="72" y="743" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="700" fill="#1F1B16" >12px 이하는 w500</text><text x="72" y="762" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="500" fill="#5C5348" >현재는 w500을 요청해도 한글은 w400 면이</text><text x="72" y="779" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="500" fill="#5C5348" >쓰인다(current-hangul-weights.png). 500 면 번들 후</text><text x="72" y="796" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="500" fill="#5C5348" >메타·칩·라벨은 w500.</text><circle cx="51" cy="814" r="11" fill="#D6336C"/><text x="51" y="818.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >3</text><text x="72" y="819" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="700" fill="#1F1B16" >보조 글자색</text><text x="72" y="838" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="500" fill="#5C5348" >inkMuted #6B6358 → #5C5348 (유리 위 5.5:1 → 7.0:1, 노트</text><text x="72" y="855" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="500" fill="#5C5348" >파스텔 위 최소 4.6:1 → 5.9:1). 11px 라벨은 12px로.</text><circle cx="751" cy="662" r="11" fill="#D6336C"/><text x="751" y="666.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >4</text><text x="772" y="667" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="700" fill="#1F1B16" >자간</text><text x="772" y="686" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="500" fill="#5C5348" >한글 라벨의 letterSpacing 0.8은 0으로. 대문자 변환이 없는 한글은 자간만</text><text x="772" y="703" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="500" fill="#5C5348" >벌어져 글자가 흩어져 보인다.</text><circle cx="751" cy="738" r="11" fill="#D6336C"/><text x="751" y="742.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >5</text><text x="772" y="743" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="700" fill="#1F1B16" >미리보기 3~4줄 + 페이드</text><text x="772" y="762" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="500" fill="#5C5348" >반쯤 잘린 줄이 푸터 칩과 겹치지 않게 마스크 페이드. 개인(내 클라우드) 칩은 제거하고</text><text x="772" y="779" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="500" fill="#5C5348" >프로젝트 노트만 티어를 표시.</text></svg>