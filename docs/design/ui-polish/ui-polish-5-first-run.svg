<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080"><defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EDE6FA"/><stop offset=".5" stop-color="#F7E8EE"/><stop offset="1" stop-color="#FFE9DC"/></linearGradient><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EDE6FA"/><stop offset=".5" stop-color="#F7E8EE"/><stop offset="1" stop-color="#FFE9DC"/></linearGradient><clipPath id="c3"><rect x="60" y="150" width="724" height="690" rx="12"/></clipPath><clipPath id="a5"><rect x="820" y="100" width="764" height="760" rx="24"/></clipPath><linearGradient id="wg4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAE4FD"/><stop offset="1" stop-color="#FFE9DC"/></linearGradient></defs><rect width="1600" height="1080" fill="#FBF8F4"/><text x="40" y="48" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700" fill="#1F1B16" >5 · 첫인상 — 로그인 직후 빈 보드(샘플 노트 1개)</text><text x="40" y="74" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13.5" font-weight="500" fill="#5C5348" >현재 캡처: 카드 1장과 큰 빈 공간. 제안: 환영 카드 + 샘플 노트에 질문 유도 + 빈 칸을 행동 카드로.</text><rect x="40" y="100" width="764" height="760" rx="24" fill="url(#bg1)" /><rect x="820" y="100" width="764" height="760" rx="24" fill="url(#bg2)" /><text x="64" y="134" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="700" fill="#6B6358" >전 · 현재</text><text x="844" y="134" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="700" fill="#6C4CF5" >후 · 제안</text><g clip-path="url(#c3)"><image href="current-desktop-first-run.png" x="-228.0" y="129.0" width="1440.0" height="900.0"/></g><g clip-path="url(#a5)"><text x="840" y="186" font-family="Georgia, AppleMyungjo, serif" font-size="32" font-weight="700" fill="#1F1B16" letter-spacing="-0.3" >노트</text><text x="840" y="212" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="500" fill="#5C5348" >1개 항목 · 노트 1개 · PDF 0개</text><rect x="840" y="230" width="480" height="44" rx="22" fill="#FFFFFF" stroke="#E4DDD0" stroke-width="1" fill-opacity="0.74" /><g transform="translate(856 242) scale(0.8333333333333334)" fill="none" stroke="#5C5348" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3a8 8 0 1 0 0 16 8 8 0 0 0 0-16z"/><path d="m21 21-4.3-4.3"/></g><text x="886" y="258" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="400" fill="#5C5348" >노트와 PDF 검색…</text><rect x="1332" y="230" width="104" height="44" rx="14" fill="#6C4CF5" /><g transform="translate(1346 243) scale(0.75)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></g><text x="1372" y="257" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="600" fill="#fff" >새 노트</text><rect x="1444" y="230" width="120" height="44" rx="14" fill="#FFFFFF" stroke="#E4DDD0" stroke-width="1" /><g transform="translate(1458 243) scale(0.75)" fill="none" stroke="#1F1B16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></g><text x="1484" y="257" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="600" fill="#1F1B16" >PDF 올리기</text><rect x="840" y="296" width="724" height="176" rx="24" fill="url(#wg4)" stroke="#FFFFFF" stroke-width="1.5" /><rect x="860" y="316" width="56" height="56" rx="18" fill="#FFFFFF" fill-opacity="0.85" /><g transform="translate(868 324) scale(1.6666666666666667)" fill="none" stroke="#6C4CF5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/></g><rect x="896" y="350" width="32" height="22" rx="11.0" fill="#6C4CF5" /><g transform="translate(903 353) scale(0.6666666666666666)" fill="#fff" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></g><text x="932" y="340" font-family="Georgia, AppleMyungjo, serif" font-size="22" font-weight="700" fill="#1F1B16" >PageBlink에 오신 걸 환영해요</text><text x="932" y="366" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="500" fill="#5C5348" >노트를 쓰고 PDF를 올린 뒤 질문하면, 답마다 ⚡ 출처가 해당 페이지로 안내해요.</text><circle cx="1536" cy="324" r="14" fill="#1F1B16" fill-opacity=".06"/><g transform="translate(1529 317) scale(0.5833333333333334)" fill="none" stroke="#5C5348" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></g><rect x="860" y="396" width="212" height="56" rx="16" fill="#FFFFFF" stroke="#E4DDD0" stroke-width="1" fill-opacity="0.88" /><rect x="870" y="408" width="32" height="32" rx="10" fill="#1F1B16" fill-opacity="0.08" /><g transform="translate(877 415) scale(0.75)" fill="none" stroke="#1F1B16" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9a2.4 2.4 0 0 0 1.7-.7l4.6-4.6A2.4 2.4 0 0 0 21 14V5a2 2 0 0 0-2-2z"/><path d="M15 21v-4a2 2 0 0 1 2-2h4"/></g><text x="912" y="421" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="600" fill="#1F1B16" >1  노트 쓰기</text><text x="912" y="440" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="500" fill="#5C5348" >샘플 노트를 열어 보세요</text><rect x="1088" y="396" width="212" height="56" rx="16" fill="#FFFFFF" stroke="#E4DDD0" stroke-width="1" fill-opacity="0.88" /><rect x="1098" y="408" width="32" height="32" rx="10" fill="#1F1B16" fill-opacity="0.08" /><g transform="translate(1105 415) scale(0.75)" fill="none" stroke="#1F1B16" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></g><text x="1140" y="421" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="600" fill="#1F1B16" >2  PDF 올리기</text><text x="1140" y="440" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="500" fill="#5C5348" >회의록·논문 등</text><rect x="1316" y="396" width="212" height="56" rx="16" fill="#FFFFFF" stroke="#6C4CF5" stroke-width="1.5" fill-opacity="0.88" /><rect x="1326" y="408" width="32" height="32" rx="10" fill="#EAE4FD" fill-opacity="1" /><g transform="translate(1333 415) scale(0.75)" fill="none" stroke="#6C4CF5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></g><text x="1368" y="421" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="600" fill="#1F1B16" >3  질문해 보기</text><text x="1368" y="440" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="500" fill="#5C5348" >⚡ 출처를 눌러 보세요</text><text x="840" y="486" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="600" fill="#5C5348" >최근</text><rect x="840" y="498" width="230" height="250" rx="16" fill="#1F1B16" fill-opacity="0.06" /><rect x="840" y="496" width="230" height="250" rx="16" fill="#D9F0E1" stroke="#6C4CF5" stroke-width="1.5" /><rect x="854" y="510" width="32" height="32" rx="10" fill="#1F1B16" fill-opacity="0.08" /><g transform="translate(861 517) scale(0.75)" fill="none" stroke="#1F1B16" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9a2.4 2.4 0 0 0 1.7-.7l4.6-4.6A2.4 2.4 0 0 0 21 14V5a2 2 0 0 0-2-2z"/><path d="M15 21v-4a2 2 0 0 1 2-2h4"/></g><text x="894" y="530" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="500" fill="#5C5348" >2분 전</text><text x="854" y="568.0" font-family="Georgia, AppleMyungjo, serif" font-size="18" font-weight="700" fill="#1F1B16" >샘플 · PageBlink</text><text x="854" y="591.4" font-family="Georgia, AppleMyungjo, serif" font-size="18" font-weight="700" fill="#1F1B16" >시작하기</text><text x="854" y="626.0" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13.5" font-weight="400" fill="#1F1B16" >노트를 쓰고 PDF를 올린 뒤,</text><text x="854" y="646.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13.5" font-weight="400" fill="#1F1B16" >질문하면 ⚡ 출처가 해당</text><text x="854" y="667.0" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13.5" font-weight="400" fill="#1F1B16" >페이지로 안내합니다.</text><rect x="854" y="696" width="200" height="34" rx="17.0" fill="#FFFFFF" stroke="#6C4CF5" stroke-width="1.2" /><g transform="translate(864 705) scale(0.6666666666666666)" fill="none" stroke="#6C4CF5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></g><text x="886" y="717" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="600" fill="#2E1F85" >이 노트로 질문해 보기</text><rect x="854" y="480" width="0" height="0" rx="0.0" fill="none" /><rect x="1004" y="484" width="60" height="22" rx="11" fill="#6C4CF5" /><text x="1034" y="499" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" >샘플</text><rect x="1086" y="496" width="230" height="250" rx="16" fill="#FFFFFF" fill-opacity=".35" stroke="#5C5348" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="6 6"/><circle cx="1201" cy="600" r="26" fill="#EAE4FD"/><g transform="translate(1188 587) scale(1.0833333333333333)" fill="none" stroke="#6C4CF5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></g><text x="1201" y="656" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="700" fill="#1F1B16" text-anchor="middle" >새 노트 쓰기</text><text x="1201" y="678" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="500" fill="#5C5348" text-anchor="middle" >⌘N</text><rect x="1332" y="496" width="230" height="250" rx="16" fill="#FFFFFF" fill-opacity=".35" stroke="#5C5348" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="6 6"/><circle cx="1447" cy="600" r="26" fill="#EAE4FD"/><g transform="translate(1434 587) scale(1.0833333333333333)" fill="none" stroke="#6C4CF5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></g><text x="1447" y="656" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="700" fill="#1F1B16" text-anchor="middle" >PDF 올리기</text><text x="1447" y="678" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="500" fill="#5C5348" text-anchor="middle" >여기에 끌어다 놓아도 돼요</text></g><circle cx="1504" cy="304" r="11" fill="#D6336C"/><text x="1504" y="308.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >1</text><circle cx="1030" cy="706" r="11" fill="#D6336C"/><text x="1030" y="710.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >2</text><circle cx="1231" cy="576" r="11" fill="#D6336C"/><text x="1231" y="580.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >3</text><circle cx="1522" cy="394" r="11" fill="#D6336C"/><text x="1522" y="398.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >4</text><circle cx="51" cy="910" r="11" fill="#D6336C"/><text x="51" y="914.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >1</text><text x="72" y="915" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="700" fill="#1F1B16" >환영 카드(첫 실행 한정)</text><text x="72" y="934" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="500" fill="#5C5348" >문서 ≤ 2개이고 PDF 0개일 때만, ×로 닫으면 로컬 저장(shared_preferences)으로 다시 안</text><text x="72" y="951" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="500" fill="#5C5348" >보임. 별 + 번개 알약 엠블럼, 세리프 22.</text><circle cx="851" cy="910" r="11" fill="#D6336C"/><text x="851" y="914.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >2</text><text x="872" y="915" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="700" fill="#1F1B16" >샘플 노트 = 데모 시작점</text><text x="872" y="934" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="500" fill="#5C5348" >"샘플" 배지 + accent 테두리 + "이 노트로 질문해 보기" 칩. 누르면 Ask 컴포저에 샘플 질문을 채워</text><text x="872" y="951" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="500" fill="#5C5348" >전송 → 첫 ⚡ 출처 깜빡임까지 한 번에.</text><circle cx="51" cy="980" r="11" fill="#D6336C"/><text x="51" y="984.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >3</text><text x="72" y="985" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="700" fill="#1F1B16" >빈 칸 = 행동 카드</text><text x="72" y="1004" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="500" fill="#5C5348" >점선 카드(새 노트 / PDF 올리기). 노트 4개 이상이면 사라진다. 데스크톱은 드래그 앤 드롭 힌트.</text><circle cx="851" cy="980" r="11" fill="#D6336C"/><text x="851" y="984.5" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >4</text><text x="872" y="985" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="700" fill="#1F1B16" >3단계 진행</text><text x="872" y="1004" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="500" fill="#5C5348" >단계는 체크리스트가 아니라 안내 카드. 3번이 accent 테두리 1곳(화면의 보라 예산 유지: 채움 면은 "새</text><text x="872" y="1021" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="500" fill="#5C5348" >노트" 1개).</text></svg>