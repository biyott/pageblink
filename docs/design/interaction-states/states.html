<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>PageBlink 상호작용 상태 시트 (토큰 값 시각화)</title>
<style>
/* 토큰: lib/app/theme.dart Pb.light / Pb.dark 실제 값 + interaction-states-spec.md §3.1 신규 토큰 */
.theme{--ink:#1F1B16;--muted:#5C5348;--hairline:#E4DDD0;--accent:#6C4CF5;--onAccent:#fff;--accC:#EAE4FD;--onAccC:#2E1F85;
  --glass:rgba(255,255,255,.62);--strong:rgba(255,255,255,.74);--gborder:rgba(255,255,255,.80);--chip:rgba(255,255,255,.55);
  --warn:#B45309;--warnText:#92400E;--warnC:#FEF3C7;--warnB:rgba(180,83,9,.55);
  --ring:#1F1B16;--hover:rgba(31,27,22,.06);--press:rgba(31,27,22,.12);--fh:rgba(0,0,0,.08);--fp:rgba(0,0,0,.14);
  --dFg:rgba(31,27,22,.38);--dBg:rgba(31,27,22,.08);--edge28:rgba(31,27,22,.28);--sheet:#FEFAF8;
  --bg:linear-gradient(135deg,#EDE6FA,#F7E8EE,#FFE9DC);--cite:rgba(108,76,245,.12);--pulse:rgba(108,76,245,.28);--cite-rail:#6C4CF5;
  --n0:#FFF1B8;--n1:#D9F0E1;--n2:#FFDCCB;--n3:#D6E8F8;--n4:#E9E3FC;--m3h:rgba(255,255,255,.08);--m3f:rgba(255,255,255,.10);
  --shadow:0 8px 24px rgba(108,76,245,.10)}
.theme.dark{--ink:#F2EDE3;--muted:#B5AD9F;--hairline:rgba(255,255,255,.14);--accent:#B7A6FF;--onAccent:#251A63;--accC:#3A2F7A;--onAccC:#E9E3FC;
  --glass:rgba(255,255,255,.078);--strong:rgba(255,255,255,.141);--gborder:rgba(255,255,255,.16);--chip:rgba(255,255,255,.05);
  --warn:#FBBF24;--warnText:#FBBF24;--warnC:#3A2A0A;--warnB:rgba(251,191,36,.5);
  --ring:#F2EDE3;--hover:rgba(255,255,255,.06);--press:rgba(255,255,255,.12);--fh:rgba(0,0,0,.08);--fp:rgba(0,0,0,.14);
  --dFg:rgba(242,237,227,.38);--dBg:rgba(255,255,255,.08);--edge28:rgba(242,237,227,.28);--sheet:#282130;
  --bg:linear-gradient(135deg,#1E1830,#251C27,#2A1F1C);--cite:rgba(183,166,255,.14);--pulse:rgba(183,166,255,.30);--cite-rail:#B7A6FF;
  --n0:#463E22;--n1:#223A2E;--n2:#47302A;--n3:#22364A;--n4:#342C58;--m3h:rgba(255,255,255,.08);--m3f:rgba(255,255,255,.10);
  --shadow:0 8px 24px rgba(0,0,0,.30)}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 "Pretendard","Inter","Noto Sans KR",-apple-system,sans-serif;background:#d9d4de}
.theme{width:1240px;margin:0 auto;padding:28px 32px 36px;background:var(--bg);color:var(--ink)}
h1{font:600 26px/1.2 "Fraunces","Georgia",serif;margin:0 0 4px}
h2{font:600 15px/1.3 inherit;margin:26px 0 4px;letter-spacing:0}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.cell{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:120px}
.cap{font-size:11.5px;color:var(--muted);font-weight:500}
.panel{background:var(--glass);border:1px solid var(--gborder);border-radius:24px;box-shadow:var(--shadow);padding:16px 18px}
.card{background:var(--strong);border:1px solid var(--gborder);border-radius:6px 18px 18px 18px;padding:14px 16px}
.lbl{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---- 공통 상태 도구 ---- */
.ring{outline:2px solid var(--ring);outline-offset:2px}
.t{transition:background-color .12s ease-out,border-color .12s ease-out,transform .08s ease-out}
/* ---- 적게 보기 토글 ---- */
.tog{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 10px;border-radius:10px;font-weight:600;font-size:13px;color:var(--ink);background:transparent;cursor:pointer}
.tog.hv{background:var(--hover)} .tog.pr{background:var(--press);transform:scale(.98)} .tog.dis{color:var(--dFg);cursor:default}
.tog .chev{transition:transform .16s}.tog.hv .chev{transform:translateY(1px)} .tog.open .chev{transform:rotate(180deg)}
/* ---- pill 드롭다운 ---- */
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 12px;border-radius:16px;font-weight:500;font-size:13px;color:var(--ink);background:var(--chip);border:1px solid var(--hairline);cursor:pointer}
.pill svg{color:var(--muted);width:18px;height:18px}
.pill.hv{background:linear-gradient(var(--hover),var(--hover)),var(--chip);border-color:var(--edge28)}
.pill.pr{background:linear-gradient(var(--press),var(--press)),var(--chip);border-color:var(--edge28);transform:scale(.97)}
.pill.open{background:linear-gradient(var(--press),var(--press)),var(--chip);border-color:var(--edge28)} .pill.open svg{transform:rotate(180deg)}
.pill.dis{background:var(--dBg);color:var(--dFg);border-color:var(--hairline);cursor:default}.pill.dis svg{color:var(--dFg)}
.pill.warn{background:var(--warnC);border-color:var(--warnB);color:var(--warnText)} .pill.warn svg{color:var(--warnText)}
.pill.warn.hv{background:linear-gradient(rgba(180,83,9,.08),rgba(180,83,9,.08)),var(--warnC)}
.dark .pill.warn.hv{background:linear-gradient(rgba(251,191,36,.08),rgba(251,191,36,.08)),var(--warnC)}
.pill.warnOld{background:var(--warnC);border-color:var(--warnB);color:var(--warn)}
.badge{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:8px;background:rgba(46,125,79,.12);color:#2E7D4F}
.dark .badge{background:rgba(111,207,151,.12);color:#6FCF97}
.menu{width:250px;background:var(--sheet);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.18);border:1px solid var(--hairline);padding:6px}
.mi{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px;border-radius:10px;font-size:13px;color:var(--ink)}
.mi .nm{flex:1}.mi small{color:var(--muted);display:block;font-size:11.5px}
.mi.hv{background:var(--hover)} .mi.fc{background:var(--press);box-shadow:inset 0 0 0 2px var(--ring)} .mi.sel{font-weight:600}.mi.dis{color:var(--dFg)}
.mi svg{width:18px;height:18px;color:var(--accent)}
/* ---- 보내기 ---- */
.send{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--onAccent);cursor:pointer}
.send svg{width:20px;height:20px}
.send.old.hv{background:linear-gradient(var(--m3h),var(--m3h)),var(--accent)} .send.old.fc,.send.old.pr{background:linear-gradient(var(--m3f),var(--m3f)),var(--accent)}
.send.oldDis{background:var(--hairline);color:var(--muted);cursor:default}
.send.hv{background:linear-gradient(var(--fh),var(--fh)),var(--accent)} .send.pr{background:linear-gradient(var(--fp),var(--fp)),var(--accent);transform:scale(.94)}
.send.dis{background:var(--dBg);color:var(--dFg);cursor:default}
/* ---- 칩 / 카드 ---- */
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;font-weight:500;font-size:13px;background:var(--chip);border:1px solid var(--hairline);color:var(--ink);cursor:pointer}
.chip.hv{background:linear-gradient(var(--hover),var(--hover)),var(--chip);border-color:var(--edge28)}
.chip.pr{background:linear-gradient(var(--press),var(--press)),var(--chip);transform:scale(.97)}
.chip.dis{background:var(--dBg);color:var(--dFg)}
.chip.sel{background:var(--accC);border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--onAccC)}
.chip.sel.hv{background:linear-gradient(var(--hover),var(--hover)),var(--accC)}
.chip.sel svg{width:15px;height:15px}
.sug{width:300px;min-height:44px;display:flex;align-items:center;justify-content:center;padding:12px 14px;border-radius:14px;background:var(--chip);border:1px solid var(--hairline);text-align:center;font-size:14px;cursor:pointer}
.sug.hv{background:linear-gradient(var(--hover),var(--hover)),var(--chip);border-color:var(--edge28)}
.sug.pr{background:linear-gradient(var(--press),var(--press)),var(--chip);transform:scale(.985)}
.sug.oldHv{background:linear-gradient(rgba(0,0,0,.04),rgba(0,0,0,.04)),var(--chip)}
.dark .sug.oldHv{background:linear-gradient(rgba(255,255,255,.04),rgba(255,255,255,.04)),var(--chip)}
/* ---- 노트 카드 ---- */
.ncard{width:180px;height:92px;border-radius:16px;padding:12px;font:600 16px/1.25 "Fraunces","Georgia",serif;border:1px solid color-mix(in srgb,var(--ink) 10%,transparent);box-shadow:0 2px 8px color-mix(in srgb,var(--ink) 6%,transparent);cursor:pointer}
.ncard.hv{box-shadow:0 6px 16px color-mix(in srgb,var(--ink) 10%,transparent);border-color:color-mix(in srgb,var(--ink) 22%,transparent)}
.ncard.pr{transform:scale(.985);box-shadow:0 2px 8px color-mix(in srgb,var(--ink) 6%,transparent)}
/* ---- 링 후보 ---- */
.surf{width:150px;height:92px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;border:1px solid rgba(0,0,0,.05)}
.dummy{height:34px;padding:0 16px;border-radius:12px;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--accent);color:var(--onAccent)}
.dummy.neutral{background:var(--chip);color:var(--ink);border:1px solid var(--hairline)}
.rA{outline:2px solid var(--ring);outline-offset:2px}
.rB{outline:2px solid var(--ring);outline-offset:2px;box-shadow:0 0 0 2px var(--halo,#fff)}
.rC{background-image:linear-gradient(var(--press),var(--press));box-shadow:inset 0 -2px 0 var(--ring)}
.rD{outline:2px solid var(--accent);outline-offset:2px}
.rS{outline:2px solid var(--slate);outline-offset:2px}
.theme{--slate:#33415C}.theme.dark{--slate:#C3D2EE}
.light .rB{--halo:#fff} .dark .rB{--halo:#1E1830}
.cite{font-size:12.5px;line-height:1.5;border-left:3px solid var(--cite-rail);background:var(--cite);padding:6px 8px;border-radius:0 6px 6px 0;width:150px}
.pulse{background:var(--pulse)}
/* ---- hover 강도 ---- */
.hvS{width:132px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:500;font-size:13px}
.legend{font-size:11px;color:var(--muted)}
.ok{color:#2E7D4F;font-weight:600}.bad{color:#B42318;font-weight:600}
.dark .ok{color:#6FCF97}.dark .bad{color:#F97066}
.tw{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sw{width:84px;font-size:10.5px;color:var(--muted)}.sw i{display:block;height:26px;border-radius:7px;border:1px solid rgba(0,0,0,.12);margin-bottom:3px}
.cmp{display:grid;grid-template-columns:repeat(6,auto);gap:10px 18px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const chev=`<svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>`;
const send=`<svg viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>`;
const check=`<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>`;
const scope=`<svg viewBox="0 0 24 24" style="width:16px;height:16px;color:currentColor"><path d="M4 7h16M4 12h16M4 17h10"/></svg>`;
const warnI=`<svg viewBox="0 0 24 24" style="width:16px;height:16px;color:currentColor"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.5v.01"/></svg>`;
const st=(cls,f)=>cls+(f?' ring':'');
function cell(cap,html){return `<div class="cell">${html}<span class="cap">${cap}</span></div>`}
function build(theme){
  const T=theme==='dark';
  const S6=[['기본',''],['hover','hv'],['focus (키보드)','F'],['pressed','pr'],['disabled','dis']];
  let h=`<div class="theme ${theme}"><h1>⚡ PageBlink · 상호작용 상태 시트 — ${T?'다크':'라이트'}</h1>
  <p class="sub">토큰: focusRing <b>${T?'#F2EDE3':'#1F1B16'}</b> (2px + 간격 2px) · hover ${T?'흰 6%':'ink 6%'} · pressed ${T?'흰 12%':'ink 12%'} · 보라 채움 hover/pressed 검정 8%/14% · disabled 38%. 값은 interaction-states-spec.md §3.</p>`;

  // 1. 적게 보기
  const togStates=[['기본',''],['hover','hv'],['focus','F'],['pressed','pr'],['펼침 (chevron 180°)','open']];
  const tog=(c)=>`<span class="tog t ${c==='F'?'ring':c==='hv'||c==='pr'||c==='open'?c:''}">적게 보기 ${chev}</span>`;
  h+=`<h2>① ‘적게 보기’ 토글 — 답변 카드 안 (현재 → 개선)</h2><p class="sub">현재는 잉크가 글라스 면 뒤에서 26%로 감쇠 — 라이트 hover ΔL* 0.8 · focus 2.5라 사실상 같은 모습으로 보입니다(실위젯 측정과 일치). 개선은 자기 decoration으로 상태를 그립니다.</p>
  <div class="panel"><div class="row">
   <div class="card" style="flex:1"><div class="lbl">현재 (잉크가 유리 면 뒤에서 26%로 감쇠: 사실상 구별 불가)</div><div class="row">`+
   togStates.map(([c])=>cell(c,`<span class="tog">적게 보기 ${chev}</span>`)).join('')+
   `</div></div>
   <div class="card" style="flex:1"><div class="lbl">개선 (hover 6% · pressed 12% · 링 2px/2px)</div><div class="row">`+
   togStates.map(([c,k])=>cell(c,tog(k))).join('')+`</div></div></div></div>`;

  // 2. 드롭다운
  const pill=(txt,k,extra='')=>`<span class="pill t ${k==='F'?'ring':k} ${extra}">${extra==='warn'?warnI:''}${txt}${chev}</span>`;
  h+=`<h2>② 출처(범위) · 모델(자동) 드롭다운 pill</h2><p class="sub">열림 상태는 chevron 회전 + press 유지 + Semantics(expanded). 경고형은 글자·아이콘을 warnText로(현행 warn #B45309는 hover 시 4.07:1).</p>
  <div class="panel"><div class="row">`+
   [['기본',''],['hover','hv'],['focus','F'],['열림 (pressed)','open'],['disabled','dis']].map(([c,k])=>cell(c,`<span class="pill t ${k==='F'?'ring':k}">${scope} 내 문서 · 프로젝트 2 ${chev}</span>`)).join('')+
   `</div><div class="row" style="margin-top:14px">`+
   [['범위 없음 · 기본',''],['hover','hv'],['focus','F']].map(([c,k])=>cell(c,`<span class="pill t ${k==='F'?'ring':k} warn">${warnI} 범위를 선택하세요 ${chev}</span>`)).join('')+
   cell('모델 pill 기본',`<span class="pill t">Gemma 4 26B <span class="badge">무료</span> ${chev}</span>`)+
   cell('모델 pill focus',`<span class="pill t ring">자동 ${chev}</span>`)+
   `</div><div class="row" style="margin-top:16px">
   <div class="cell"><div class="menu"><div class="mi"><span class="nm">자동 (돌아가며 사용)</span></div>
   <div class="mi hv"><span class="nm">Gemma 4 26B <span class="badge">무료</span><small>빠르고 가벼움</small></span></div>
   <div class="mi sel"><span class="nm">Qwen3 235B <span class="badge">무료</span><small>긴 문서에 강함</small></span>${check}</div>
   <div class="mi fc"><span class="nm">Claude Haiku <small>유료</small></span></div>
   <div class="mi dis"><span class="nm">재색인 (사용 불가)</span></div></div>
   <span class="cap">메뉴: 행 hover 6% · 키보드 포커스 = 틴트 12% + inset 링 2px · 선택 = 체크 + w600 + Semantics(selected)</span></div>
  </div></div>`;

  // 3. 보내기
  h+=`<h2>③ 질문(보내기) 버튼 — 현재(M3 기본) → 개선</h2><p class="sub">현재: hover/focus/pressed가 보라 위 흰 8~10%라 ΔL* 3.9~5.0(1.15~1.20:1), 링 없음. 개선: 검정 8%/14% + 링.</p>
  <div class="panel"><div class="row">
   <div class="card" style="flex:1"><div class="lbl">현재</div><div class="row">`+
   [['기본',''],['hover','old hv'],['focus','old fc'],['pressed','old pr'],['disabled','oldDis']].map(([c,k])=>cell(c,`<span class="send ${k}">${send}</span>`)).join('')+
   `</div></div><div class="card" style="flex:1"><div class="lbl">개선</div><div class="row">`+
   [['기본',''],['hover','hv'],['focus','F'],['pressed','pr'],['disabled','dis']].map(([c,k])=>cell(c,`<span class="send t ${k==='F'?'ring':k}">${send}</span>`)).join('')+
   `</div></div></div>
   <div class="row" style="margin-top:14px">`+
   cell('예시 질문 · 현재 hover (4%)',`<span class="sug oldHv">이번 주 회의록을 요약해 줘</span>`)+
   cell('예시 질문 · 개선 hover (6% + 테두리 28%)',`<span class="sug hv">이번 주 회의록을 요약해 줘</span>`)+
   cell('예시 질문 · focus',`<span class="sug ring">이번 주 회의록을 요약해 줘</span>`)+
   `</div></div>`;

  // 4. 칩
  const chip=(k,sel)=>`<span class="chip t ${sel?'sel':''} ${k==='F'?'ring':k}">${sel?check:''}${sel?'내 문서':'PDF 2'}</span>`;
  h+=`<h2>④ 칩 (필터 · 범위) — 선택 × hover × focus 조합</h2><p class="sub">선택은 색만이 아니라 체크 아이콘으로 이중 표시(테두리 2.1~2.7:1, 체크 10.3:1).</p>
  <div class="panel"><div class="row">`+
   [['미선택 기본',chip('',0)],['hover',chip('hv',0)],['focus',chip('F',0)],['pressed',chip('pr',0)],['disabled',chip('dis',0)],['선택',chip('',1)],['선택 + hover',chip('hv',1)],['선택 + focus',chip('F',1)]].map(([c,m])=>cell(c,m)).join('')+
   `</div></div>`;

  // 5. 카드
  h+=`<h2>⑤ 노트 카드 — 면 색 유지, 그림자·외곽선으로 상태</h2>
  <div class="panel"><div class="row">`+
   [['기본','ncard'],['hover','ncard hv'],['focus','ncard ring'],['pressed','ncard pr']].map(([c,k],i)=>cell(c,`<div class="${k} t" style="background:var(--n3)">회의록 — 10월 기획</div>`)).join('')+
   `</div></div>`;

  // 6. 링 후보
  const surfaces=[['유리 패널','var(--glass)'],['노트 파스텔','var(--n0)'],['인용 칸 (pulse)','var(--pulse)'],['배경 그라데이션','var(--bg)']];
  const cand=[['A. 단색 링+간격 · ink (추천)','rA'],['A′. 같은 구조, 슬레이트 색 (대안, 라이트 6.7:1 / 다크 3.46:1)','rS'],['B. 이중 링','rB'],['C. 틴트+밑줄','rC'],['D. 보라 링 (현행 계열)','rD']];
  h+=`<h2>⑥ 포커스 링 후보 4종 × 표면 4종</h2><p class="sub">버튼 두 개: 보라 채움(좌) · 중립(우). 인용 칸은 좌측 레일(3px 보라)+12% 면+pulse 28%.</p>`;
  cand.forEach(([n,c])=>{
    h+=`<div class="panel" style="margin-bottom:10px"><div class="lbl">${n}</div><div class="row">`+
    surfaces.map(([sn,sv])=>`<div class="cell"><div class="surf" style="background:${sv}">${sn==='인용 칸 (pulse)'?`<div class="cite pulse">이 구절이 인용됩니다</div>`:''}<div class="dummy ${c}">새 노트</div><div class="dummy neutral ${c}">보내기</div></div><span class="cap">${sn}</span></div>`).join('')+`</div></div>`;
  });

  // 7. hover 강도
  const lv=[['H0 기본 4%',T?'rgba(255,255,255,.04)':'rgba(31,27,22,.04)'],['H1 6% (추천)',T?'rgba(255,255,255,.06)':'rgba(31,27,22,.06)'],['H2 8%',T?'rgba(255,255,255,.08)':'rgba(31,27,22,.08)'],['H3 12%',T?'rgba(255,255,255,.12)':'rgba(31,27,22,.12)']];
  h+=`<h2>⑦ hover 강도 후보 (같은 면 위에서 rest와 나란히)</h2><p class="sub">ΔL*: 라이트 H0 2.9~3.1 · H1 4.3~4.7 · H2 5.7~6.3 · H3 8.6~9.5 / 다크 H0 2.7~4.2 · H1 4.0~6.2 · H2 5.4~8.2 · H3 8.0~12.2</p>
  <div class="panel"><div class="row">`+
   lv.map(([n,c])=>`<div class="cell"><div class="row" style="gap:6px"><div class="hvS" style="background:var(--strong)">rest</div><div class="hvS" style="background:linear-gradient(${c},${c}),var(--strong)">hover</div></div><span class="cap">${n} · 유리</span><div class="row" style="gap:6px"><div class="hvS" style="background:var(--n0)">rest</div><div class="hvS" style="background:linear-gradient(${c},${c}),var(--n0)">hover</div></div><span class="cap">${n} · 버터 노트</span></div>`).join('')+
   `</div></div>`;

  // 8. 대비 표
  const rows=T?[['링 #F2EDE3 vs 답변 카드 스택 #524B54','7.0'],['링 vs 인용 pulse #716788','4.5 (최소)'],['링 vs 노트 5색','9.1~10.9'],['accent 링 #B7A6FF vs 인용 pulse','2.49 (미달)'],['보라 채움 hover 글자 #251A63 on #A899EB','5.98'],['inkMuted #B5AD9F on 답변 카드 스택','3.8 (별도 이슈)']]
    :[['링 #1F1B16 vs 유리/스택','15.9~16.9'],['링 vs 인용 pulse #D6CCFB','11.3 (최소)'],['링 vs 노트 5색','13.3~15.1'],['accent 링 #6C4CF5 vs 인용 pulse','3.47 (마진 부족)'],['보라 채움 hover 흰 글자 on #6346E1','6.0'],['warn #B45309 on warnContainer hover','4.07 (미달) → warnText 5.75']];
  h+=`<h2>⑧ 대비 근거 (WCAG 1.4.11 비텍스트 3:1 · 글자 4.5:1)</h2><div class="panel"><table style="border-collapse:collapse;font-size:12.5px">`+rows.map(r=>`<tr><td style="padding:3px 18px 3px 0">${r[0]}</td><td style="font-weight:600">${r[1]}</td></tr>`).join('')+`</table></div></div>`;
  return h;
}
const mode=new URLSearchParams(location.search).get('t');
document.getElementById('root').innerHTML=(mode==='dark'?'':build('light'))+(mode==='light'?'':build('dark'));
// 키보드 포커스 시뮬레이션 표시용: 'F' 상태는 .ring 클래스로 이미 적용
document.querySelectorAll('.tog,.pill,.chip,.send,.sug,.ncard').forEach(e=>{if(e.className.includes(' F'))e.classList.add('ring')});
</script>
